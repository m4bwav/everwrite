# Runs the checker's self-test and holds the repo's own prose to its checker on the platforms it promises.
name: tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: self-test
        run: python skills/everwrite/scripts/test_tells.py
      - name: the repo's own prose passes its checker
        run: python skills/everwrite/scripts/tells.py README.md AGENTS.md skills/everwrite/SKILL.md skills/everwrite/references
